<!doctype html>
<html>
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script><meta charset="utf-8"><title>Tape — preview</title>
<style>html,body{margin:0}body{padding:48px 56px;display:flex;gap:64px;align-items:flex-start}</style></head>
<body class="pb-page">
<div class="pb-window pb-taped" style="width:300px">
  <span class="pb-tape pb-tape--tl" aria-hidden="true"></span><span class="pb-tape pb-tape--br" aria-hidden="true"></span>
  <div class="pb-window__bar"><code>[file].png</code><span class="pb-window__controls" aria-hidden="true"><i></i><i></i></span></div>
  <div class="pb-todo" style="aspect-ratio:4/3"><div><b>Screenshot needed</b></div></div>
</div>
<div class="pb-window pb-taped" data-theme="paper" style="width:240px;transform:rotate(1.4deg)">
  <span class="pb-tape pb-tape--top" aria-hidden="true"></span>
  <div class="pb-todo" style="aspect-ratio:1"><div><b>Artwork needed</b></div></div>
</div>
<script>window.PB && PB.init();</script>
</body>
</html>

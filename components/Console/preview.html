<!doctype html>
<html>
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script><meta charset="utf-8"><title>Console — preview</title>
<style>html,body{margin:0}body{padding:24px 32px 40px}</style></head>
<body class="pb-page">
<details class="pb-console pb-console--inline" open>
  <summary>Index · <span class="pb-ph">[n]</span> pieces</summary>
  <div class="pb-console__body">
    <progress max="1" value="0.4" aria-label="Pieces seen on this page"></progress>
    <ul class="pb-console__log">
      <li><b>open</b>visual work</li>
      <li><b>show</b><span class="pb-ph">[piece name]</span> · <span class="pb-ph">[medium]</span></li>
      <li class="is-dim"><b>next</b>about</li>
    </ul>
  </div>
</details>
<script>
window.PB && PB.init();
(function(){ var c=document.querySelector('.pb-console'), i=0, words=[['show','[piece name] · [medium]'],['open','code'],['show','[project name]']];
  if(!window.PB||matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  setInterval(function(){ var w=words[i++%words.length]; PB.log(c,w[0],w[1],{max:6}); }, 2600); })();
</script>
</body>
</html>

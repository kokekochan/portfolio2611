<!doctype html>
<html>
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script><meta charset="utf-8"><title>Terminal — preview</title>
<style>html,body{margin:0}body{padding:24px 32px 32px;}</style></head>
<body class="pb-page">
<div class="pb-window pb-term pb-crt" data-loop style="max-width:640px">
  <div class="pb-window__bar"><span>session_01</span><span class="pb-window__controls" aria-hidden="true"><i></i><i></i></span></div>
  <div class="pb-term__body">
    <p class="pb-term__line pb-term__line--cmd">open project --name [project-name]</p>
    <p class="pb-term__line pb-term__line--dim">reading notes ........ 4 of 4</p>
    <p class="pb-term__line">What I set out to make: [one plain sentence]</p>
    <p class="pb-term__line">What I did: [one plain sentence]</p>
    <p class="pb-term__line pb-term__line--hl">Where AI helped: [only if my notes say so]</p>
    <p class="pb-term__line pb-term__line--cmd">show screenshot</p>
  </div>
  <div class="pb-term__status"><span>Lines <b>6</b></span><span>Mode read</span></div>
</div>
<script>window.PB && PB.init();</script>
</body>
</html>
